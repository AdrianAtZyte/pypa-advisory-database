summary: 'uv: Path traversal on Windows through wheel extraction'
details: "### Impact\n\nIn versions of uv from 0.12.7 to 0.12.18 on Windows, uv could be induced into writing a file outside of the installation prefix during wheel installation.\n\nA malicious wheel could use this to place an executable outside of the intended environment, including in a directory already present on the user's PATH. \n\nThis vulnerability only affects Windows hosts; no other platforms are affected.\n\n### Patches\n\nuv 0.12.18 and newer address this vulnerability. Users are encouraged to upgrade to 0.12.18.\n\n### Workarounds\n\nThere is no workaround other than upgrading to uv 0.12.18."
